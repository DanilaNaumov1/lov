<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Собери наше фото 🧩</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Собери наше фото 🧩</h1>
        <p class="subtitle">Выбери режим игры!</p>
    </div>

    <div class="controls" id="controlsPanel">
        <div class="mode-selector">
            <button class="mode-btn" onclick="selectMode('my')">
                <span class="emoji">💕</span>
                Наше фото
                <br><small style="font-weight: normal; opacity: 0.8;">Фото уже в сайте</small>
            </button>
            <button class="mode-btn" onclick="selectMode('any')">
                <span class="emoji">📷</span>
                Любое фото
                <br><small style="font-weight: normal; opacity: 0.8;">Загрузи своё</small>
            </button>
        </div>

        <div class="control-group" id="anyPhotoGroup">
            <label for="imageInput">📷 Выбери фото:</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <div class="piece-info" id="pieceInfo">
            📐 Размер фото: <span id="photoSize">0×0</span><br>
            🧩 Получится кусочков: <span id="pieceCount">0</span> (сетка <span id="gridSize">0×0</span>)<br>
            <small style="color: #666;">Размер кусочка: <span id="pieceSizeDisplay">0</span>px</small>
        </div>

        <button class="start-btn" id="startBtn" onclick="startGame()">
            Начать игру 🎮
        </button>
    </div>

    <div class="game-info" id="gameInfo">
        <div class="info-item">
            <div class="info-label">Ходы</div>
            <div class="info-value" id="movesCount">0</div>
        </div>
        <div class="info-item">
            <div class="info-label">Правильно</div>
            <div class="info-value" id="correctCount">0</div>
        </div>
        <div class="info-item">
            <div class="info-label">Всего</div>
            <div class="info-value" id="totalCount">0</div>
        </div>
    </div>

    <div class="puzzle-container" id="puzzleContainer">
        <div class="puzzle-board" id="puzzleBoard"></div>
        <div class="game-actions">
            <button class="action-btn" onclick="showPreview()">👁️ Подсказка</button>
            <button class="action-btn" onclick="shufflePieces()">🔀 Перемешать</button>
            <button class="action-btn" onclick="location.reload()">🔄 В начало</button>
        </div>
    </div>

    <div class="preview-modal" id="previewModal" onclick="closePreview()">
        <button class="close-preview">×</button>
        <img id="previewFull" alt="Original">
    </div>

    <div class="win-modal" id="winModal">
        <div class="win-content">
            <h2>Поздравляю! 🎉</h2>
            <img class="win-image" id="winImage" alt="Complete">
            <p>Ты собрала пазл за <span id="finalMoves">0</span> ходов!</p>
            <p style="font-size: 1.5rem; color: #764ba2; font-weight: bold;">
                Ты невероятна солнышко, прсото вау! 💖
            </p>
            <button class="restart-btn" onclick="location.reload()">
                Играть ещё раз 🔄
            </button>
        </div>
    </div>

    <div class="hearts-container" id="heartsContainer"></div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
