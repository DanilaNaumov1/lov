<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Собери наше фото 🧩</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
        }

        .controls {
            background: rgba(255, 255, 255, 0.95);
            padding: 1.5rem;
            border-radius: 20px;
            margin-bottom: 1rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .mode-selector {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .mode-btn {
            padding: 1.5rem;
            border: 3px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
        }

        .mode-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
        }

        .mode-btn .emoji {
            font-size: 2rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        .control-group {
            margin-bottom: 1rem;
            display: none;
        }

        .control-group.active {
            display: block;
        }

        .control-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
        }

        .control-group input[type="file"] {
            width: 100%;
            padding: 0.5rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
        }

        .piece-info {
            background: #f0f0ff;
            padding: 1rem;
            border-radius: 10px;
            margin: 1rem 0;
            text-align: center;
            color: #764ba2;
            font-weight: 600;
            display: none;
            line-height: 1.6;
        }

        .start-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            display: none;
        }

        .start-btn.active {
            display: block;
        }

        .start-btn:hover {
            transform: translateY(-2px);
        }

        .start-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .game-info {
            background: rgba(255, 255, 255, 0.95);
            padding: 1rem;
            border-radius: 15px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-around;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 0.9rem;
            color: #666;
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #764ba2;
        }

        .puzzle-container {
            position: relative;
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
        }

        .puzzle-board {
            display: grid;
            gap: 2px;
            background: #ddd;
            padding: 2px;
            border-radius: 10px;
            overflow: hidden;
            margin: 0 auto;
        }

        .puzzle-piece {
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            background-size: cover;
            background-position: center;
            aspect-ratio: 1;
        }

        .puzzle-piece:hover {
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .puzzle-piece.selected {
            box-shadow: 0 0 0 4px #667eea, 0 5px 15px rgba(0,0,0,0.3);
            z-index: 20;
            transform: scale(1.1);
        }

        .puzzle-piece.correct {
            box-shadow: inset 0 0 0 2px #28a745;
        }

        .game-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            min-width: 120px;
            padding: 0.8rem;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .action-btn:hover {
            background: #5a6268;
        }

        .preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .preview-modal img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 15px;
        }

        .preview-modal .close-preview {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .win-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .win-content {
            background: white;
            border-radius: 30px;
            padding: 3rem;
            text-align: center;
            max-width: 500px;
            animation: winAnimation 1s;
        }

        @keyframes winAnimation {
            0% { transform: scale(0) rotate(-180deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .win-content h2 {
            color: #764ba2;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .win-content p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 1rem;
        }

        .win-image {
            max-width: 100%;
            border-radius: 15px;
            margin: 1rem 0;
        }

        .restart-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 1rem;
        }

        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .floating-heart {
            position: absolute;
            font-size: 2rem;
            animation: floatUp 3s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.5rem; }
            .controls { padding: 1rem; }
            .puzzle-container { padding: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Собери наше фото 🧩</h1>
        <p class="subtitle">Выбери режим игры!</p>
    </div>

    <div class="controls" id="controlsPanel">
        <div class="mode-selector">
            <button class="mode-btn" onclick="selectMode('my')">
                <span class="emoji">💕</span>
                Наше фото
                <br><small style="font-weight: normal; opacity: 0.8;">Фото уже в сайте</small>
            </button>
            <button class="mode-btn" onclick="selectMode('any')">
                <span class="emoji"></span>
                Любое фото
                <br><small style="font-weight: normal; opacity: 0.8;">Загрузи своё</small>
            </button>
        </div>

        <div class="control-group" id="anyPhotoGroup">
            <label for="imageInput"> Выбери фото:</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <div class="piece-info" id="pieceInfo">
            📐 Размер фото: <span id="photoSize">0×0</span><br>
             Получится кусочков: <span id="pieceCount">0</span> (сетка <span id="gridSize">0×0</span>)<br>
            <small style="color: #666;">Размер кусочка: <span id="pieceSizeDisplay">0</span>px</small>
        </div>

        <button class="start-btn" id="startBtn" onclick="startGame()">
            Начать игру 🎮
        </button>
    </div>

    <div class="game-info" id="gameInfo" style="display: none;">
        <div class="info-item">
            <div class="info-label">Ходы</div>
            <div class="info-value" id="movesCount">0</div>
        </div>
        <div class="info-item">
            <div class="info-label">Правильно</div>
            <div class="info-value" id="correctCount">0</div>
        </div>
        <div class="info-item">
            <div class="info-label">Всего</div>
            <div class="info-value" id="totalCount">0</div>
        </div>
    </div>

    <div class="puzzle-container" id="puzzleContainer">
        <div class="puzzle-board" id="puzzleBoard"></div>
        <div class="game-actions">
            <button class="action-btn" onclick="showPreview()">👁️ Подсказка</button>
            <button class="action-btn" onclick="shufflePieces()">🔀 Перемешать</button>
            <button class="action-btn" onclick="location.reload()">🔄 В начало</button>
        </div>
    </div>

    <div class="preview-modal" id="previewModal" onclick="closePreview()">
        <button class="close-preview">×</button>
        <img id="previewFull" alt="Original">
    </div>

    <div class="win-modal" id="winModal">
        <div class="win-content">
            <h2>Поздравляю! 🎉</h2>
            <img class="win-image" id="winImage" alt="Complete">
            <p>Ты собрала пазл за <span id="finalMoves">0</span> ходов!</p>
            <p style="font-size: 1.5rem; color: #764ba2; font-weight: bold;">
                Ты amazing! 
            </p>
            <button class="restart-btn" onclick="location.reload()">
                Играть ещё раз 🔄
            </button>
        </div>
    </div>

    <div class="hearts-container" id="heartsContainer"></div>

        const MAX_PIECES = 150;
        const MIN_PIECE_SIZE = 40;
        const MAX_DIMENSION = 800;
        const MIN_MOVES_TO_WIN = 5; // Минимум ходов перед победой

        let pieces = [];
        let selectedPiece = null;
        let moves = 0;
        let correctPieces = 0;
        let totalPieces = 0;
        let imageData = null;
        let cols = 0;
        let rows = 0;
        let pieceSize = 0;
        let currentMode = null;
        let gameStarted = false;

        function selectMode(mode) {
            currentMode = mode;
            
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('anyPhotoGroup').classList.remove('active');
            document.getElementById('pieceInfo').style.display = 'none';
            document.getElementById('startBtn').classList.remove('active');
            imageData = null;
            gameStarted = false;

            if (mode === 'my') {
                document.querySelectorAll('.mode-btn')[0].classList.add('active');
                
                if (!MY_PHOTO_BASE64) {
                    alert('️ Фото ещё не добавлено!\n\nПопроси Данила вставить фото в код сайта.');
                    return;
                }
                
                processImage(MY_PHOTO_BASE64);
            } else {
                document.querySelectorAll('.mode-btn')[1].classList.add('active');
                document.getElementById('anyPhotoGroup').classList.add('active');
            }
        }

        document.getElementById('imageInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    processImage(event.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        function processImage(src) {
            const img = new Image();
            img.onload = () => {
                let width = img.width;
                let height = img.height;
                
                if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
                    const ratio = Math.min(MAX_DIMENSION / width, MAX_DIMENSION / height);
                    width = Math.floor(width * ratio);
                    height = Math.floor(height * ratio);
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                imageData = canvas.toDataURL();

                const totalArea = width * height;
                const areaPerPiece = totalArea / MAX_PIECES;
                pieceSize = Math.max(MIN_PIECE_SIZE, Math.round(Math.sqrt(areaPerPiece)));
                
                cols = Math.floor(width / pieceSize);
                rows = Math.floor(height / pieceSize);
                
                cols = Math.max(4, cols);
                rows = Math.max(4, rows);
                
                totalPieces = cols * rows;

                document.getElementById('photoSize').textContent = `${width}×${height}`;
                document.getElementById('pieceCount').textContent = totalPieces;
                document.getElementById('gridSize').textContent = `${cols}×${rows}`;
                document.getElementById('pieceSizeDisplay').textContent = pieceSize;
                document.getElementById('pieceInfo').style.display = 'block';
                document.getElementById('startBtn').classList.add('active');
            };
            img.src = src;
        }

        function startGame() {
            if (!imageData) return;

            gameStarted = true;
            document.getElementById('controlsPanel').style.display = 'none';
            document.getElementById('gameInfo').style.display = 'flex';
            document.getElementById('puzzleContainer').style.display = 'block';
            document.getElementById('totalCount').textContent = totalPieces;

            createPuzzle();
        }

        function createPuzzle() {
            const board = document.getElementById('puzzleBoard');
            board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            board.style.maxWidth = `${cols * pieceSize}px`;
            board.innerHTML = '';
            pieces = [];
            selectedPiece = null;
            moves = 0;
            correctPieces = 0;

            const img = new Image();
            img.onload = () => {
                const pieceWidth = img.width / cols;
                const pieceHeight = img.height / rows;

                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        const canvas = document.createElement('canvas');
                        canvas.width = pieceWidth;
                        canvas.height = pieceHeight;
                        const ctx = canvas.getContext('2d');
                        
                        ctx.drawImage(
                            img,
                            col * pieceWidth, row * pieceHeight, pieceWidth, pieceHeight,
                            0, 0, pieceWidth, pieceHeight
                        );

                        pieces.push({
                            id: row * cols + col,
                            correctId: row * cols + col,
                            imageData: canvas.toDataURL()
                        });
                    }
                }

                // Перемешиваем до тех пор, пока хотя бы один кусочек не будет не на месте
                do {
                    shuffleArray(pieces);
                } while (isSolved());

                renderBoard();
            };
            img.src = imageData;
        }

        function isSolved() {
            return pieces.every((p, i) => p.id === p.correctId);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderBoard() {
            const board = document.getElementById('puzzleBoard');
            board.innerHTML = '';

            pieces.forEach((piece, index) => {
                const pieceDiv = document.createElement('div');
                pieceDiv.className = 'puzzle-piece';
                pieceDiv.style.backgroundImage = `url(${piece.imageData})`;
                pieceDiv.dataset.index = index;

                if (piece.id === piece.correctId) {
                    pieceDiv.classList.add('correct');
                }

                pieceDiv.addEventListener('click', () => handlePieceClick(index));
                board.appendChild(pieceDiv);
            });

            updateInfo();
        }

        function handlePieceClick(index) {
            if (!gameStarted) return;

            const pieceElements = document.querySelectorAll('.puzzle-piece');

            if (selectedPiece === null) {
                selectedPiece = index;
                pieceElements[index].classList.add('selected');
            } else if (selectedPiece === index) {
                pieceElements[index].classList.remove('selected');
                selectedPiece = null;
            } else {
                // Не даём менять местами два правильных кусочка
                const piece1 = pieces[selectedPiece];
                const piece2 = pieces[index];
                
                if (piece1.id === piece1.correctId && piece2.id === piece2.correctId) {
                    // Оба уже на месте — ничего не делаем
                    pieceElements[selectedPiece].classList.remove('selected');
                    selectedPiece = null;
                    return;
                }

                [pieces[selectedPiece], pieces[index]] = [pieces[index], pieces[selectedPiece]];
                moves++;
                selectedPiece = null;
                renderBoard();
                
                // Проверяем победу только после минимального количества ходов
                if (moves >= MIN_MOVES_TO_WIN && isSolved()) {
                    setTimeout(showWin, 800);
                }
            }
        }

        function updateInfo() {
            document.getElementById('movesCount').textContent = moves;
            correctPieces = pieces.filter(p => p.id === p.correctId).length;
            document.getElementById('correctCount').textContent = correctPieces;
        }

        function shufflePieces() {
            do {
                shuffleArray(pieces);
            } while (isSolved());
            moves = 0;
            renderBoard();
        }

        function showPreview() {
            document.getElementById('previewFull').src = imageData;
            document.getElementById('previewModal').style.display = 'flex';
        }

        function closePreview() {
            document.getElementById('previewModal').style.display = 'none';
        }

        function showWin() {
            document.getElementById('winImage').src = imageData;
            document.getElementById('finalMoves').textContent = moves;
            document.getElementById('winModal').style.display = 'flex';
            createHearts();
        }

        function createHearts() {
            const container = document.getElementById('heartsContainer');
            const hearts = ['❤️', '💕', '💖', '💗', '💝', '✨'];

            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.top = '100%';
                    container.appendChild(heart);
                    setTimeout(() => heart.remove(), 3000);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
